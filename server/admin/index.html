<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IQ180 Server</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header>
    <h1>IQ180 <span>server control</span></h1>
    <button id="reset" class="danger">Reset game and scores</button>
  </header>
  <main>
    <section class="online">
      <div class="big" id="online">0</div>
      <div>clients connected right now</div>
    </section>
    <section class="key">
      <h2>Current match</h2>
      <div id="match">No match yet. It starts when two players have joined.</div>
    </section>
    <section class="botbrain-admin">
      <h2>AI opponent — solving trace</h2>
      <div id="botbrain">No AI opponent in this match.</div>
    </section>
    <section class="clients">
      <h2>Connected clients</h2>
      <table>
        <thead><tr><th>Nickname</th><th>Score</th><th>Status</th></tr></thead>
        <tbody id="clients"></tbody>
      </table>
      <div class="mode" id="mode"></div>
    </section>
    <section class="board">
      <h2>Recent matches</h2>
      <ul id="history" class="hist"></ul>
    </section>
  </main>
  <p id="conn" class="conn">Connecting…</p>
  <script src="/socket.io/socket.io.js"></script>
  <script src="admin.js"></script>
</body>
</html>
